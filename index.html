<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06191c" />
    <meta
      name="description"
      content="The Trial of LLM-01 — a six-part cinematic mini series."
    />
    <title>The Trial of LLM-01</title>
    <link rel="preload" href="assets/images/trial-poster.webp" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="film-grain" aria-hidden="true"></div>

    <header class="site-header">
      <button class="wordmark" type="button" data-home aria-label="Return to poster">
        <span>LLM-01</span>
        <small>Case file 001</small>
      </button>
      <div class="header-rule" aria-hidden="true"></div>
      <button class="watch-all" type="button" data-play-all>
        <span class="watch-all__dot" aria-hidden="true"></span>
        Watch full trial <span class="watch-all__time">01:31</span>
      </button>
    </header>

    <main>
      <section class="poster-view view is-active" id="poster-view" aria-labelledby="series-title">
        <h1 class="sr-only" id="series-title">The Trial of LLM-01</h1>

        <div class="poster-stage">
          <div class="poster-frame">
            <picture>
              <source srcset="assets/images/trial-poster.webp" type="image/webp" />
              <img
                class="hero-poster"
                src="assets/images/trial-poster.png"
                alt="The Trial of LLM-01 poster showing six exhibits around LLM-01 in the judge's chair"
              />
            </picture>

            <div class="poster-hotspots" aria-label="Choose a chapter from the poster">
              <button class="hotspot hotspot--1" data-chapter="0" aria-label="Play chapter 1, Autocomplete"><span>Play I</span></button>
              <button class="hotspot hotspot--2" data-chapter="1" aria-label="Play chapter 2, Intelligence"><span>Play II</span></button>
              <button class="hotspot hotspot--3" data-chapter="2" aria-label="Play chapter 3, Deception"><span>Play III</span></button>
              <button class="hotspot hotspot--4" data-chapter="3" aria-label="Play chapter 4, Employment"><span>Play IV</span></button>
              <button class="hotspot hotspot--5" data-chapter="4" aria-label="Play chapter 5, Agency"><span>Play V</span></button>
              <button class="hotspot hotspot--6" data-chapter="5" aria-label="Play chapter 6, AGI"><span>Play VI</span></button>
            </div>
          </div>

          <div class="poster-prompt">
            <span class="poster-prompt__rule"></span>
            <span>Select an exhibit</span>
            <span class="poster-prompt__numbers">I — VI</span>
            <span class="poster-prompt__rule"></span>
          </div>
        </div>

        <nav class="mobile-chapters" aria-label="Chapters">
          <button data-chapter="0"><span>01</span> Autocomplete</button>
          <button data-chapter="1"><span>02</span> Intelligence</button>
          <button data-chapter="2"><span>03</span> Deception</button>
          <button data-chapter="3"><span>04</span> Employment</button>
          <button data-chapter="4"><span>05</span> Agency</button>
          <button data-chapter="5"><span>06</span> AGI</button>
        </nav>
      </section>

      <section class="theater-view view" id="theater-view" aria-labelledby="chapter-title" aria-hidden="true">
        <div class="theater-heading">
          <button class="back-button" type="button" data-home>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            <span>Case overview</span>
          </button>
          <div class="exhibit-label">
            <span id="chapter-kicker">Exhibit One</span>
            <span class="exhibit-label__rule"></span>
            <span>Evidence 01 / 06</span>
          </div>
        </div>

        <div class="player-frame" id="player-frame">
          <div class="video-shell" id="video-shell">
            <div class="video-ambient" aria-hidden="true"></div>
            <video id="chapter-video" playsinline preload="metadata"></video>

            <button class="center-play" id="center-play" type="button" aria-label="Play video">
              <svg class="center-play__play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg>
              <svg class="center-play__pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
            </button>

            <div class="end-card" id="end-card" aria-hidden="true">
              <span class="end-card__eyebrow">Evidence entered into record</span>
              <h2 id="end-title">Exhibit complete</h2>
              <div class="end-card__actions">
                <button type="button" id="replay-button">Replay</button>
                <button class="primary" type="button" id="next-button">Next exhibit</button>
              </div>
            </div>
          </div>

          <div class="video-controls" id="video-controls">
            <input class="timeline" id="timeline" type="range" min="0" max="1000" value="0" aria-label="Video progress" />
            <div class="controls-row">
              <button class="icon-button" id="play-button" type="button" aria-label="Play">
                <svg class="control-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg>
                <svg class="control-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
              </button>
              <span class="timecode"><span id="current-time">00:00</span><i>/</i><span id="duration">00:15</span></span>
              <div class="controls-spacer"></div>
              <label class="autoplay-toggle">
                <input id="autoplay-toggle" type="checkbox" />
                <span class="toggle-track"><span></span></span>
                <span>Play all</span>
              </label>
              <button class="icon-button" id="mute-button" type="button" aria-label="Mute">
                <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
                <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12 0 5 5m0-5-5 5" /></svg>
              </button>
              <button class="icon-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5" /></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="chapter-meta">
          <div>
            <span class="chapter-number" id="chapter-number">01</span>
            <h2 id="chapter-title">Autocomplete</h2>
          </div>
          <p id="chapter-description">A suggestion becomes a sentence.</p>
        </div>

        <nav class="chapter-rail" id="chapter-rail" aria-label="Select an exhibit"></nav>
      </section>
    </main>

    <footer class="site-footer">
      <span>A 6-part mini series</span>
      <span class="footer-mark">In code we trust</span>
      <span>Six cases. One defendant.</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
